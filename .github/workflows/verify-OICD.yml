name: Verify OIDC

on:
  workflow_dispatch:
  push:
    branches: [development]

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Mostrar claims del token (debug)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "No se obtuvo token. Revisa permissions: id-token: write"
            exit 1
          fi
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub"):
              print(k, "=", claims.get(k))
          PY

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::174655393856:role/lab09-github-actions-dev
          aws-region: us-east-2

      - name: Verificar identidad
        run: aws sts get-caller-identity
