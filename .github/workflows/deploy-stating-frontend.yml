name: Deploy Staging - Frontend React

run-name: ${{ github.actor }} - Desplegando Frontend a Staging (dev)

on:
  push:
    branches:
      - development  

permissions:
  contents: read
  id-token: write

jobs:
  desplegar-frontend-staging:
    runs-on: ubuntu-latest
    environment: dev  

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}  
          aws-region: ${{ vars.AWS_REGION }}       

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json 

      - name: Instalar dependencias y compilar producción
        working-directory: frontend 
        run: |
          npm ci
          npm run build
          echo "Generando build optimizado de React."

      - name: Publicar en S3 y CloudFront
        run: |
          # Reemplaza 'frontend/dist' o 'frontend/build' según la ruta de compilación real
          # aws s3 sync frontend/dist/ s3://tu-bucket-staging/ --delete
          echo "Subiendo estáticos al bucket S3 de Staging y refrescando CloudFront."