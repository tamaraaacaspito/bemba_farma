name: Deploy Staging - Frontend React

run-name: ${{ github.actor }} - Desplegando Frontend a Staging (dev)

on:
  push:
    branches:
      - development  

permissions:
  contents: read
  id-token: write

jobs:
  desplegar-frontend-staging:
    runs-on: ubuntu-latest
    environment: dev  

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6  

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}  
          aws-region: ${{ vars.AWS_REGION }}       

      
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'npm'

      - name: Instalar dependencias y compilar producción
        run: |
          npm ci
          npm run build
          echo "Generando build optimizado de React."

      - name: Publicar en S3 y CloudFront
        run: |
          # Reemplaza 'dist' o 'build' por la carpeta de compilación real de tu proyecto React (ej. dist/ o build/)
          # aws s3 sync dist/ s3://tu-bucket-staging/ --delete
          echo "Subiendo estáticos al bucket S3 de Staging y refrescando CloudFront."